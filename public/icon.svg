<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle for standard icon -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Subtle outer border -->
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6" />

  <!-- Outer Orbit / Focus Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-dasharray="24 16" />

  <!-- Subtle glow core -->
  <circle cx="256" cy="256" r="110" fill="#6366f1" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Modern Geometric Khoros 'K' + Chrono / Sand-clock glyph -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Central Hexagonal / Shield facet -->
    <path d="M-50 -90 L50 -90 L90 0 L50 90 L-50 90 L-90 0 Z" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Sharp Stylized K / Timeline Needle Mark -->
    <path d="M-36 -55 L-36 55" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <path d="M-36 0 L36 -55" stroke="url(#primaryGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M0 -18 L38 55" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
    
    <!-- Real-time pulse node -->
    <circle cx="38" cy="55" r="7" fill="#38bdf8" />
    <circle cx="-36" cy="-55" r="7" fill="#ffffff" />
  </g>
</svg>
